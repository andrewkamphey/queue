<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:440px;height:280px;overflow:hidden;background:#f91880;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#fff}
.wrap{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 36px;box-sizing:border-box}
.row{display:flex;align-items:center;gap:16px}
.q{width:64px;height:64px;border-radius:16px;background:#fff;color:#f91880;font-weight:800;font-size:44px;display:flex;align-items:center;justify-content:center}
h1{font-size:40px;margin:0;font-weight:800;letter-spacing:-1px}
p{font-size:20px;line-height:1.3;margin:18px 0 0;font-weight:600}
.pill{display:inline-flex;margin-top:22px;border:2px solid #fff;border-radius:999px;overflow:hidden;font-weight:700;font-size:15px;align-self:flex-start}
.pill span{padding:7px 14px}.pill span+span{border-left:2px solid rgba(255,255,255,.5);padding:7px 10px}
</style></head><body><div class="wrap">
<div class="row"><div class="q">Q</div><h1>Queue</h1></div>
<p>One click schedules your post into the next slot on X and LinkedIn.</p>
<div class="pill"><span>Queue</span><span>▾</span></div>
</div></body></html>
